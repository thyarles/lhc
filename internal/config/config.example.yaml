# lhc configuration.
#
# Every key shows its default. In the file lhc writes, every setting is
# commented out: only lines without the "#" are this host's choices, and
# everything else follows the defaults of the installed version, so a new
# default arrives with the upgrade. `lhc install` comments out settings that
# only repeat a default, including an older release's.
#
# Change values with `lhc config set key=value` (it uncomments the line,
# validates and keeps your comments), check them with `lhc config validate`,
# and see what this host changes with `lhc config show --diff`.

# The name this host uses in reports, subject lines and saved report files.
# Blank = the kernel hostname. The resolved DNS name is deliberately NOT used:
# on clustered hosts it is often a shared VIP name.
hostname: ""

smtp:
  host: relay.example.com
  port: 25
  # none | starttls | implicit. A username needs starttls or implicit:
  # lhc will not send a password in clear text.
  tls: none
  # Accept a self-signed relay certificate.
  tls_skip_verify: false
  username: ""
  password: ""
  # Blank = lhc@<this host's name>.
  from: ""

email:
  # Small "the system is alive" group: gets every run's report.
  daily_recipients: []
  # Broad list: hears only about NEW problems worth acting on.
  alert_recipients: []
  # inline     — HTML in the body, plain text as the alternative (recommended)
  # attachment — plain text in the body, HTML as a file
  # both       — inline and attached
  html_mode: inline
  # The daily list's mail on a run with nothing for the alert list:
  # always — every run (the behaviour without a hub)
  # auto   — skip it when at least one hub collector accepted this run's
  #          report, mail it when none did; the same as always without a hub
  # never  — no heartbeat; only alerts are mailed
  # Alerts are mailed in every mode.
  heartbeat: auto

alerts:
  # Minimum severity that reaches alert_recipients: caution | unhealthy.
  notify_all_on: unhealthy
  # Re-notify about a condition still open after this long. 0 = never.
  remind_caution: 168h
  remind_unhealthy: 24h
  # Forget a condition that has been clear this long, so a genuine
  # recurrence notifies again instead of being deduplicated.
  forget_after: 72h

schedule:
  # First run of the day, HH:MM.
  time: "00:07"
  # 0 = once a day. Otherwise whole hours, e.g. 6h runs at 00:07, 06:07,
  # 12:07 and 18:07.
  every: 0
  # Hosts are all installed with the same time, so scheduled runs wait a
  # random slice of random_window first instead of all scanning at once. A
  # run started by hand is never delayed. Re-run `lhc install` after changing.
  random: true
  random_window: 8h

reports:
  # Saved reports to keep. 0 keeps everything.
  keep: 30

# Blank = /var/lib/lhc, /var/lib/lhc/reports and /var/log/lhc.log as root,
# ~/.local/state/lhc otherwise.
paths:
  state_dir: ""
  report_dir: ""
  log_file: ""

# Hub: after every run, send this host's report, encrypted, to one or more
# collectors (hosts running `lhc collect`). Two collectors are the expected
# setup: each keeps its own copy, so losing one loses nothing. A collector
# that is down never stops an alert or changes the exit status; see
# email.heartbeat for the daily mail.
hub:
  # Empty = off. e.g. ["http://192.0.2.10:8461", "http://192.0.2.11:8461"]
  collectors: []
  # The shared hub key: make it once with `lhc hub keygen` and copy the
  # same file to every host (install.sh --hub-key-file). Mode 0600.
  key_file: /etc/lhc/hub.key

# Collector: only on the hosts that receive reports. `lhc install --collector`
# turns this on and adds the lhc-collect service. Reports land in
# <state_dir>/hub/<host>.json; nothing is ever sent back to a host.
collector:
  enabled: false
  # host:port to listen on. Open it in the firewall to the hosts that report here.
  listen: ":8461"
  # Largest request, and largest report once decompressed.
  max_report_size: 1MiB
  # Local time, HH:MM, of the daily digest: one mail listing every host's
  # latest report. After the hosts' nightly window (schedule.time plus
  # schedule.random_window, 00:07 + 8h by default), so every host has
  # reported today: move it when you change those.
  digest_time: "09:00"
  # Empty = email.daily_recipients.
  digest_recipients: []
  # A host with no report for this long is SILENT. Hosts report at least
  # daily and the random window moves a run by up to 8h, hence 26h.
  silent_after: 26h
  # Host names of the other collectors. Each digest says whether they still
  # report, so a dead collector shows up in the others' digests.
  # e.g. ["lhc-c2.example.com", "lhc-c3.example.com"]
  peers: []
  # one  — one digest per hub: the first collector by name (this host and
  #        peers, sorted) sends at digest_time and tells the others over the
  #        hub port; the next sends takeover_after later only if it heard
  #        nothing, and so on. A lost notice can only add a mail, never lose
  #        one. Each collector's nightly run also checks it can reach the
  #        relay, and the digest flags one that cannot.
  # each — every collector sends its own digest.
  # Give every collector of a hub the same digest_time and takeover_after.
  digest_mode: one
  takeover_after: 15m

checks:
  system:
    enabled: true
  cpu:
    enabled: true
    # Percent busy, for all cores together. A single core at caution or
    # above is listed, and alerts (CAUTION) only when the same core was busy
    # on the previous run too: something stuck, not one busy process.
    caution: 80
    unhealthy: 95
    # Load average thresholds, as multiples of the CPU count.
    load_caution_mult: 1
    load_unhealthy_mult: 2
  memory:
    enabled: true
    caution: 80                # percent of RAM used; swap rows use the same levels
    unhealthy: 95              # only RAM at this level alerts, never swap
  disk:
    enabled: true
    caution: 90                # percent used per filesystem; alerts at caution too
    unhealthy: 95
    # Extra mount-point patterns to skip, ON TOP OF the built-in list
    # (kubelet, containerd, docker, podman, netns, snap). '*' also matches '/',
    # so "/mnt/scratch/*" skips everything under it but not /mnt/scratch itself.
    ignore: []
  processes:
    enabled: true
    # A zombie only holds a PID until its parent reaps it or exits, so only a
    # pile big enough to matter alerts. Fewer show as an INFO count. Set them
    # lower on a host where any pile is unexpected.
    zombie_caution: 2500
    zombie_unhealthy: 3000
  services:
    enabled: true
  docker:
    enabled: true
    # A container that exited non-zero within this many hours is a fresh
    # crash (caution). Older ones are assumed to have been stopped on purpose.
    recent_hours: 24
  kubernetes:
    enabled: true
    # auto    — cluster-wide, plus a per-node pod summary on a multi-node cluster
    # cluster — always the whole cluster
    # node    — only pods scheduled on this host (and no PVCs)
    scope: auto
    # Explicit kubeconfig path. Empty = $KUBECONFIG, then rke2, k3s, kubeadm,
    # /root/.kube/config, $HOME/.kube/config (first readable one wins).
    kubeconfig: ""
    # Individual signals, so one noisy source can be silenced alone.
    nodes: true
    pods: true
    pvcs: true
    events: true
    images: true
    # Images churn on every deploy: count only, unless this lists the first 10.
    list_images: false
    # Pending/ContainerCreating younger than this is the scheduler working.
    pending_minutes: 15
    # Restarts picked up SINCE THE LAST RUN that make a pod CAUTION (the total
    # count is meaningless).
    restart_delta_caution: 3
    # Evicted pods older than this are old news (INFO).
    evicted_recent_hours: 24
    # Guard rail: stop reading the pod list past this many rows.
    max_pods: 2000
  updates:
    enabled: true
    # Pending updates are planned maintenance. 0 reports the counts as INFO
    # only; a positive number raises CAUTION and an alert at that count.
    caution: 0
    # The same, for security updates (apt and zypper only).
    security_caution: 0
    # An installed update that waits for a reboot (usually a kernel) is
    # always shown, dated from when that update was installed. It is INFO
    # at first, CAUTION (with an alert) once pending longer than
    # reboot_caution_days, and UNHEALTHY after reboot_unhealthy_days.
    # 0 turns a step off; set both to 0 on hosts that are not rebooted by
    # policy, and the pending reboot stays one INFO line.
    reboot_caution_days: 14
    reboot_unhealthy_days: 30
  users:
    enabled: true
  auth:
    enabled: true
    # Failed SSH attempts today. Internet-facing hosts see a constant
    # background level, so these are deliberately high.
    failed_ssh_caution: 50
    failed_ssh_unhealthy: 500
  fail2ban:
    enabled: true
    # A ban is fail2ban working, not a problem. Set this to flag an unusual
    # spike (currently banned IPs summed over all jails); 0 = off.
    banned_ips_caution: 0
  ports:
    enabled: true
    # Loopback sockets cannot be reached from off the host and churn
    # through random high ports. true lists them anyway.
    list_local: false
  crontabs:
    enabled: true
  suid:
    enabled: true
  packages:
    enabled: true
  etc:
    enabled: true
    # find -path patterns to skip, added to the built-in list (mtab,
    # resolv.conf, ld.so.cache, ...). Backup agents that drop timestamped
    # files into /etc belong here.
    ignore:
      - /etc/CommVaultRegistryBackups/*
  logs:
    enabled: true
    # "Invalid user" / "BREAK-IN ATTEMPT" lines today before SSH probing is
    # CAUTION. 0 = count only. At most 200: the scan keeps the last 200 matches.
    ssh_brute_force_min: 50
    # Site-specific patterns, checked after the 9 built-in ones.
    # pattern: case-insensitive grep -E regex; source: system | auth;
    # severity: info | caution | unhealthy; min_count: escalate at this many
    # today (0 = never escalate, max 200). Example:
    #  - label: NFS Timeouts
    #    pattern: "nfs: server .* not responding"
    #    source: system
    #    severity: caution
    #    min_count: 3
    extra_patterns: []
  rootkit:
    enabled: true
  network:
    enabled: true
  tools:
    enabled: true
