name: check

# Every PR, every push to main, and called by release.yml as the gate a tag
# must pass. A pipeline that tags untested code is worse than no pipeline.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: End-to-end
        run: go test -race -tags e2e ./test/e2e/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  deps:
    name: Dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: ./scripts/check-deps.sh
      - run: go mod tidy -diff

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags '-s -w' -o lhc ./cmd/lhc
      - name: Statically linked
        run: file lhc | tee /dev/stderr | grep -q 'statically linked'
      - name: Runs
        if: matrix.arch == 'amd64'
        run: ./lhc version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'amd64'
        with:
          name: lhc-amd64
          path: lhc
          retention-days: 1

  smoke:
    # One real report on each package-manager family, so every branch of the
    # dnf/yum/apt-get/zypper parsing meets real output. centos:7 also proves
    # the binary runs on kernel-3.10-era userland. Plain `docker run` rather
    # than a job container: the runner's own actions cannot start inside
    # centos:7 (its glibc is too old for them).
    name: Smoke ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "rockylinux:9", "centos:7", "opensuse/leap:15"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lhc-amd64
      - name: Report inside ${{ matrix.image }}
        run: |
          chmod +x lhc
          docker run --rm -v "$PWD:/w" "${{ matrix.image }}" sh -euc '
            /w/lhc version
            /w/lhc report --config /dev/null --format json > /tmp/report.json
            grep -q "\"schema\": 1" /tmp/report.json
            /w/lhc report --config /dev/null --format text
          '
